<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0863c9" />
  <title>Page not found | DPGSA UoN</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #252a31; background: #fff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { padding: 20px max(24px, calc((100vw - 1160px) / 2)); border-bottom: 1px solid #dce3ea; }
    header a { color: #174b80; font-weight: 700; text-decoration: none; }
    header span { display: block; margin-top: 4px; color: #68727d; font-size: 12px; font-weight: 400; }
    main { width: min(760px, calc(100% - 40px)); margin: auto; padding: 90px 0; }
    p { color: #68727d; line-height: 1.7; }
    a.button { display: inline-block; margin-top: 12px; padding: 13px 17px; background: #0863c9; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; }
    footer { border-top: 1px solid #dce3ea; border-bottom: 0; color: #68727d; font-size: 12px; }
  </style>
</head>
<body>
  <header><a href="/">DPGSA<span>University of Nairobi</span></a></header>
  <main><p>Page not found</p><h1>We could not find that page.</h1><p>The address may have changed or the page may not exist.</p><a class="button" href="/">Return to the homepage</a></main>
  <footer>DPGSA UoN demo</footer>
</body>
</html>
